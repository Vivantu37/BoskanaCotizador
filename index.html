<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boskana · Cotizador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --negro: #0a0a0a;
    --negro-2: #141414;
    --negro-3: #1f1f1f;
    --linea: #2a2a2a;
    --linea-2: #383838;
    --amarillo: #ffcf00;
    --amarillo-soft: rgba(255, 207, 0, 0.1);
    --amarillo-mid: rgba(255, 207, 0, 0.5);
    --blanco: #ffffff;
    --texto: #e8e8e8;
    --texto-2: #a0a0a0;
    --texto-3: #6a6a6a;
    --verde: #4ade80;
    --rojo: #ef4444;
    --naranja: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--negro);
    color: var(--texto);
    font-family: 'Chakra Petch', 'Inter', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
    letter-spacing: 0.2px;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 20% 0%, rgba(255, 207, 0, 0.04) 0%, transparent 50%),
      radial-gradient(circle at 80% 100%, rgba(255, 207, 0, 0.03) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }
  .app { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 24px; }

  /* HEADER */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 28px;
    background: var(--negro-2);
    border: 1px solid var(--linea);
    border-radius: 4px 4px 0 0;
    border-bottom: none;
  }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { height: 38px; width: auto; display: block; }
  .brand-divider { width: 1px; height: 26px; background: var(--linea-2); }
  .brand-tag {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 11px;
    color: var(--amarillo);
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 500;
  }
  .header-right { text-align: right; }
  .user-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    background: var(--negro-3);
    border: 1px solid var(--linea-2);
    border-radius: 2px;
    font-size: 12px;
    font-family: 'Chakra Petch', sans-serif;
    letter-spacing: 1px;
  }
  .user-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--amarillo); }
  .header-date {
    font-size: 10px;
    color: var(--texto-3);
    margin-top: 6px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* TABS */
  .tabs {
    display: flex;
    background: var(--negro-2);
    border-left: 1px solid var(--linea);
    border-right: 1px solid var(--linea);
    border-bottom: 1px solid var(--linea);
    padding: 0;
    gap: 0;
  }
  .tab {
    flex: 1;
    padding: 16px 24px;
    background: none;
    border: none;
    color: var(--texto-2);
    font-family: 'Chakra Petch', sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    position: relative;
  }
  .tab:hover { color: var(--texto); background: rgba(255, 207, 0, 0.03); }
  .tab.active {
    color: var(--amarillo);
    border-bottom-color: var(--amarillo);
    background: rgba(255, 207, 0, 0.04);
  }
  .tab.active::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--amarillo), transparent);
  }

  /* PANELES */
  .panel {
    background: var(--negro-2);
    border: 1px solid var(--linea);
    border-top: none;
    padding: 36px;
    border-radius: 0 0 4px 4px;
    display: none;
    min-height: 500px;
  }
  .panel.active { display: block; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; }
  @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

  /* SECTION TITLES */
  .section-title {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--amarillo);
    margin-bottom: 20px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--linea-2);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-title::before {
    content: '';
    width: 12px; height: 1px;
    background: var(--amarillo);
  }
  .section-title + .section-title { margin-top: 32px; }

  /* CAMPOS */
  .field { margin-bottom: 16px; }
  label {
    display: block;
    font-family: 'Chakra Petch', sans-serif;
    font-size: 10px;
    font-weight: 500;
    color: var(--texto-2);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  input, select {
    width: 100%;
    padding: 11px 14px;
    background: var(--negro-3);
    border: 1px solid var(--linea-2);
    border-radius: 2px;
    color: var(--texto);
    font-family: 'Chakra Petch', sans-serif;
    font-size: 14px;
    letter-spacing: 0.5px;
    transition: all 0.15s;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--amarillo);
    background: var(--negro);
    box-shadow: 0 0 0 3px var(--amarillo-soft);
  }
  input[readonly] { background: rgba(0,0,0,0.4); color: var(--texto-2); cursor: not-allowed; }
  select { appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='%23ffcf00' d='M4 6l4 4 4-4z'/%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 12px center; background-size: 16px; padding-right: 36px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .help-text { font-size: 10px; color: var(--texto-3); margin-top: 4px; letter-spacing: 1px; }

  /* RESUMEN / CALC BOX */
  .calc-box {
    background: linear-gradient(180deg, var(--negro-3) 0%, var(--negro) 100%);
    border: 1px solid var(--linea-2);
    border-left: 3px solid var(--amarillo);
    padding: 24px 28px;
    border-radius: 2px;
    position: relative;
    overflow: hidden;
  }
  .calc-box::before {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 80px; height: 80px;
    background: radial-gradient(circle at top right, var(--amarillo-soft), transparent 70%);
    pointer-events: none;
  }
  .calc-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 0;
    border-bottom: 1px dashed var(--linea-2);
    font-size: 13px;
  }
  .calc-row:last-child { border-bottom: none; }
  .calc-row .label { color: var(--texto-2); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; }
  .calc-row .value { color: var(--texto); font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: 0.5px; }
  .calc-row.highlight {
    font-size: 20px;
    color: var(--amarillo);
    padding: 14px 0;
    margin: 8px 0;
    border-top: 1px solid var(--amarillo-mid);
    border-bottom: 1px solid var(--amarillo-mid);
    background: rgba(255, 207, 0, 0.04);
    margin-left: -28px; margin-right: -28px; padding-left: 28px; padding-right: 28px;
  }
  .calc-row.highlight .label { color: var(--amarillo); font-size: 11px; font-weight: 700; }
  .calc-row.highlight .value { color: var(--amarillo); font-size: 22px; font-weight: 700; }
  .calc-row.mens {
    font-size: 16px;
    padding: 12px 0;
    margin-top: 8px;
    border-top: 1px solid var(--linea-2);
  }
  .calc-row.mens .label { color: var(--texto); font-weight: 600; }
  .calc-row.mens .value { color: var(--blanco); font-size: 18px; font-weight: 700; }

  /* BUTTONS */
  .actions { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
  button {
    padding: 13px 22px;
    background: var(--amarillo);
    color: var(--negro);
    border: none;
    border-radius: 2px;
    cursor: pointer;
    font-family: 'Chakra Petch', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  button:hover { background: #ffd933; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(255, 207, 0, 0.25); }
  button:active { transform: translateY(0); }
  button.secondary {
    background: transparent;
    color: var(--amarillo);
    border: 1px solid var(--amarillo);
  }
  button.secondary:hover { background: var(--amarillo-soft); box-shadow: none; transform: none; }
  button.ghost {
    background: var(--negro-3);
    color: var(--texto-2);
    border: 1px solid var(--linea-2);
  }
  button.ghost:hover { background: var(--linea); color: var(--texto); box-shadow: none; transform: none; }
  button.danger { background: transparent; color: var(--rojo); border: 1px solid var(--rojo); }
  button.danger:hover { background: rgba(239, 68, 68, 0.1); box-shadow: none; transform: none; }
  button:disabled { background: var(--negro-3); color: var(--texto-3); cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-sm { padding: 7px 12px; font-size: 10px; letter-spacing: 1px; }

  /* INFO BOX */
  .info-card {
    background: var(--negro-3);
    border: 1px solid var(--linea-2);
    border-radius: 2px;
    padding: 18px 20px;
    font-size: 12px;
    color: var(--texto-2);
    line-height: 1.7;
    letter-spacing: 0.5px;
  }
  .info-card strong { color: var(--amarillo); font-weight: 600; }

  /* WARNING */
  .warning {
    margin-top: 14px;
    padding: 12px 16px;
    background: rgba(245, 158, 11, 0.1);
    border-left: 3px solid var(--naranja);
    color: #fbbf24;
    font-size: 12px;
    border-radius: 2px;
    display: none;
    letter-spacing: 0.5px;
  }
  .warning.show { display: block; }

  /* STATS */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 28px; }
  .stat {
    background: var(--negro-3);
    border: 1px solid var(--linea-2);
    border-radius: 2px;
    padding: 18px 20px;
    position: relative;
    overflow: hidden;
  }
  .stat::after {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px; height: 100%;
    background: var(--amarillo);
  }
  .stat .num {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 32px;
    font-weight: 700;
    color: var(--amarillo);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .stat .lbl {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 10px;
    color: var(--texto-2);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-top: 8px;
  }

  /* FILTER BAR */
  .filter-bar { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
  .filter-bar input, .filter-bar select { width: auto; min-width: 160px; padding: 9px 12px; font-size: 12px; }

  /* TABLAS */
  .table-wrap { border: 1px solid var(--linea-2); border-radius: 2px; overflow: hidden; }
  .table-scroll { max-height: 560px; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  thead { position: sticky; top: 0; z-index: 1; }
  th {
    background: var(--negro-3);
    color: var(--amarillo);
    font-family: 'Chakra Petch', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-align: left;
    padding: 12px 14px;
    border-bottom: 1px solid var(--linea-2);
  }
  td {
    padding: 11px 14px;
    border-bottom: 1px solid var(--linea);
    color: var(--texto);
    letter-spacing: 0.3px;
  }
  tbody tr { transition: background 0.1s; }
  tbody tr:hover { background: rgba(255, 207, 0, 0.03); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: 'Chakra Petch', sans-serif; }

  /* BADGES */
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 2px;
    font-family: 'Chakra Petch', sans-serif;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    border: 1px solid;
  }
  .badge-Disponible { background: rgba(74, 222, 128, 0.1); color: var(--verde); border-color: rgba(74, 222, 128, 0.4); }
  .badge-Apartado { background: rgba(245, 158, 11, 0.1); color: var(--naranja); border-color: rgba(245, 158, 11, 0.4); }
  .badge-Vendido { background: rgba(239, 68, 68, 0.1); color: var(--rojo); border-color: rgba(239, 68, 68, 0.4); }
  .badge-Nodisponible { background: rgba(106, 106, 106, 0.1); color: var(--texto-3); border-color: var(--linea-2); }

  /* EMPTY / LOADING */
  .empty, .loading {
    padding: 60px 30px;
    text-align: center;
    color: var(--texto-3);
    font-style: italic;
    letter-spacing: 1px;
  }

  /* FOOTER PIE */
  .app-footer {
    margin-top: 24px;
    padding: 16px;
    text-align: center;
    font-size: 10px;
    color: var(--texto-3);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .app-footer span { color: var(--amarillo); }

  /* ====== IMPRESIÓN / PDF ====== */
  .print-area { display: none; }
  @media print {
    @page { size: letter; margin: 12mm; }
    body { background: white; }
    body * { visibility: hidden; }
    .print-area, .print-area * { visibility: visible; }
    .print-area { display: block; position: absolute; top: 0; left: 0; width: 100%; padding: 0; background: white; }
  }

  /* ====================================
     DOCUMENTO PDF — Paleta: negro #0a0a0a, amarillo #ffcf00, gris fuerte #4a4a4a
     ==================================== */
  .doc {
    font-family: 'Chakra Petch', 'Inter', sans-serif;
    color: #0a0a0a;
    background: white;
    font-size: 10px;
    line-height: 1.45;
    padding: 8px;
  }
  /* HEADER del PDF: fondo blanco con borde amarillo (el logo se ve nítido) */
  .doc-top {
    padding: 20px 4px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 3px solid #ffcf00;
    margin-bottom: 20px;
    position: relative;
  }
  .doc-top::after {
    content: '';
    position: absolute; bottom: -3px; left: 0;
    width: 80px; height: 3px;
    background: #0a0a0a;
  }
  .doc-top img { height: 42px; display: block; }
  .doc-folio {
    color: #4a4a4a;
    font-family: 'Chakra Petch', sans-serif;
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-align: right;
    font-weight: 500;
  }
  .doc-folio strong {
    display: block;
    color: #0a0a0a;
    font-size: 15px;
    letter-spacing: 2px;
    margin-top: 4px;
    font-weight: 700;
  }
  .doc-title {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #0a0a0a;
    text-align: center;
    margin: 18px 0 4px;
  }
  .doc-subtitle {
    text-align: center;
    font-size: 9px;
    color: #4a4a4a;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 22px;
    font-weight: 500;
  }
  .doc-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 14px;
  }
  .doc-box {
    border: 1px solid #d4d4d4;
    border-left: 3px solid #ffcf00;
    padding: 12px 16px;
    border-radius: 2px;
    background: #ffffff;
  }
  .doc-box h3 {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 2.5px;
    color: #0a0a0a;
    margin-bottom: 9px;
    padding-bottom: 6px;
    border-bottom: 1px solid #d4d4d4;
    font-weight: 700;
  }
  .doc-box .row {
    display: flex;
    justify-content: space-between;
    padding: 2.5px 0;
    font-size: 10px;
  }
  .doc-box .row .l { color: #4a4a4a; letter-spacing: 0.5px; font-size: 9.5px; font-weight: 500; }
  .doc-box .row .v { font-weight: 600; color: #0a0a0a; }

  /* ===== BLOQUE DE TOTALES — Fondo claro, paleta restringida ===== */
  .doc-totals {
    background: #fafafa;
    border: 1px solid #d4d4d4;
    border-left: 4px solid #ffcf00;
    padding: 18px 22px;
    border-radius: 2px;
    margin: 16px 0;
  }
  .doc-totals .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 0;
    font-size: 11px;
  }
  .doc-totals .row .l {
    color: #4a4a4a;
    font-size: 9.5px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: 500;
  }
  .doc-totals .row .v {
    color: #0a0a0a;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: 11px;
  }
  .doc-totals .row.divider {
    border-top: 1px solid #d4d4d4;
    margin-top: 6px;
    padding-top: 8px;
  }
  /* PRECIO TOTAL — destacado en negro grande, fondo amarillo sutil */
  .doc-totals .row.total {
    background: #ffcf00;
    margin: 10px -22px;
    padding: 10px 22px;
    border-top: 2px solid #0a0a0a;
    border-bottom: 2px solid #0a0a0a;
  }
  .doc-totals .row.total .l {
    color: #0a0a0a;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
  }
  .doc-totals .row.total .v {
    color: #0a0a0a;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  /* MENSUALIDAD — fondo negro con texto amarillo, máximo impacto */
  .doc-totals .row.mensualidad {
    background: #0a0a0a;
    margin: 10px -22px -18px;
    padding: 14px 22px;
    border-radius: 0 0 2px 2px;
  }
  .doc-totals .row.mensualidad .l {
    color: #ffcf00;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 2px;
  }
  .doc-totals .row.mensualidad .v {
    color: #ffcf00;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .doc-obs {
    background: #fff8d6;
    border-left: 3px solid #ffcf00;
    padding: 9px 14px;
    font-size: 10px;
    margin-bottom: 14px;
    border-radius: 2px;
    color: #0a0a0a;
  }
  .doc-obs strong { color: #0a0a0a; }

  .doc-h2 {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: #0a0a0a;
    margin: 14px 0 8px;
    padding-bottom: 6px;
    border-bottom: 2px solid #ffcf00;
  }
  table.doc-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 9px;
    font-family: 'Chakra Petch', sans-serif;
  }
  table.doc-table th {
    background: #0a0a0a;
    color: #ffcf00;
    padding: 6px 10px;
    text-align: left;
    font-size: 8.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    border: none;
  }
  table.doc-table th.num { text-align: right; }
  table.doc-table td {
    padding: 4px 8px;
    border-bottom: 1px solid #d4d4d4;
    color: #0a0a0a;
  }
  table.doc-table tr:nth-child(even) td { background: #fafafa; }
  table.doc-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.doc-table .anual { background: rgba(255, 207, 0, 0.15); }
  table.doc-table .anual td { color: #0a0a0a; font-weight: 600; }

  .doc-footer {
    margin-top: 18px;
    padding-top: 10px;
    border-top: 1px solid #d4d4d4;
    text-align: center;
    font-size: 7px;
    color: #4a4a4a;
    line-height: 1.5;
  }
  .doc-footer .legal { font-style: italic; color: #4a4a4a; margin-bottom: 4px; font-size: 7px; }
  .doc-footer .brand-line {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-top: 6px;
    color: #0a0a0a;
    font-family: 'Chakra Petch', sans-serif;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-size: 7px;
    font-weight: 500;

</style>
<script>
// Cargador robusto del SDK de Supabase: prueba múltiples CDNs hasta que una funcione.
// IMPORTANTE: solo intenta la siguiente CDN si la anterior FALLA realmente.
(function() {
  const CDNS = [
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',
    'https://unpkg.com/@supabase/supabase-js@2',
    'https://cdn.skypack.dev/@supabase/supabase-js@2'
  ];
  let idx = 0;
  function intentar() {
    // Si ya cargó (window.supabase existe), no intentamos más.
    if (window.supabase) {
      console.log('[SDK] Ya disponible, no se intentan más CDNs');
      return;
    }
    if (idx >= CDNS.length) {
      console.error('[SDK] No se pudo cargar Supabase desde ninguna CDN');
      window.__supabaseError = 'No se pudo cargar el SDK desde ninguna CDN. Verifica tu internet y desactiva bloqueadores de anuncios.';
      return;
    }
    const url = CDNS[idx++];
    console.log('[SDK] Intentando cargar:', url);
    const s = document.createElement('script');
    s.src = url;
    s.onload = function() {
      console.log('[SDK] Script cargado desde:', url);
      // No invocar intentar() de nuevo aquí — el script ya cargó.
    };
    s.onerror = function() {
      console.warn('[SDK] Falló la carga de:', url);
      // Solo intentar la siguiente si window.supabase NO existe
      if (!window.supabase) intentar();
    };
    document.head.appendChild(s);
  }
  intentar();
})();
</script>
</head>
